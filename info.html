<!DOCTYPE html>
<html>
    <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almattar-Tech </title>
    <link rel="stylesheet" href="design.css.css">
    <script type="module" src="javascript.js" defer></script>
    </head>
    <body>
         <nav>
         <div>
               <img src="logo.png" alt="Logo">
      </div>
        <ul class="nnn">
            <li class="nav-text"><i>ALMATTAR-TECH</i></li>
            <li class="space"><button onclick="window.location.href='index.html'">HOME</button></li>
            <li><button onclick="window.location.href='news.html'">NEWS</button></li>
            <li><button onclick="window.location.href='videos.html'">videos</button></li>
            <li><button onclick="window.location.href='contact.html'">CONTACT</button></li>
            <li><button class="buttons"onclick="window.location.href='info.html'">INFO</button></li>
        </ul>
        <input class="search" type="search" placeholder="Search...">
    </nav>
    <main class="content-page" data-content-page="info">
        <button class="content-add" type="button" hidden aria-label="Add information content">+</button>
        <form class="content-form" hidden>
            <label>
                Image or video
                <input type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" required>
            </label>
            <label>
                Description
                <textarea maxlength="500" required></textarea>
            </label>
            <div class="content-form-actions">
                <button type="submit">Add</button>
                <button class="content-form-cancel" type="button">Cancel</button>
            </div>
        </form>
        <p class="content-status" aria-live="polite"></p>
        <section class="content-list" aria-label="Information content"></section>
    </main>
    </body>
</html>
