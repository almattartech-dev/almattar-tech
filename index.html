<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <nav data-database-url="https://almattar-tech-default-rtdb.firebaseio.com">
        <div>
            <img src="logo.png" alt="Logo">
            <span class="nav-text"><i>ALMATTAR-TECH</i></span>
        </div>
        <ul class="nnn">
            <li class="space"><button class="buttons" onclick="window.location.href='index.html'">HOME</button></li>

            <li><button onclick="window.location.href='videos.html'">VIDEOS</button></li>

    <div id="loginModal" class="login-modal" hidden>
        <section class="login-panel" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
            <button id="closeLoginModal" class="login-close" type="button" aria-label="Close">&times;</button>
            <h2 id="loginTitle">تسجيل الدخول</h2>
            <form id="adminLoginForm" class="login-form">
                <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="adminPassword" placeholder="كلمة المرور" required>
                <button class="login-submit" type="submit">تأكيد الدخول</button>
            </form>
            <div class="login-divider">أو</div>
            <button id="googleLoginBtn" class="google-login" type="button">
                <svg class="google-login-icon" viewBox="0 0 18 18" aria-hidden="true">
                    <path d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>

                    <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.97 4.96l2.9 2.24C4.59 5.05 6.62 3.58 9 3.58z"/>
                </svg>
                الدخول بواسطة Google
            </button>
            <p id="loginMessage" class="login-message" aria-live="polite"></p>
        </section>
    </div>

    <main class="home-hero">
        <p class="pre" lang="ar" dir="rtl">مابين الاعطال و الشك
        <br><span class="tech">الجواب تلقاه عند</span></p>
        <h1><i>ALMATTAR<span class="tech">-TECH</span></i></h1>
    </main>
